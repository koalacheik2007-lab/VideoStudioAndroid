
name: Construire VideoStudioAndroid APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      
      - name: Decompresser et corriger FFmpegKit
        run: |
          unzip -o VideoStudioAndroid_PROJET_COMPLET.zip -d extracted
          cp -a extracted/VideoStudioAndroid_LIVRABLE/. .

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          old = 'implementation("com.arthenica:ffmpeg-kit-full:6.0-2.LTS")'
          new = 'implementation("dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9")'

          if old not in s:
              raise SystemExit("Ancienne dependance FFmpegKit introuvable")

          p.write_text(s.replace(old, new, 1))
          print("Dependance FFmpegKit corrigee")
          PY

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudioAndroid-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
